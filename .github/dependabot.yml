version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/openai-agents-sdk"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "@slack/*"
    labels:
      - "npm"
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
